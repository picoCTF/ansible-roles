---
docker_group_users: []
upgrade: no

docker_pin_version: false

tls_access: yes

# Where certs land on the worker; dockerd reads them via daemon.json --tls*. A /root
# subdir keeps them unreadable to a non-root container escapee.
tls_cert_path: "/root/.docker_certs"

# Certificate source (path ON THE CONTROLLER). Certs are pre-generated by
# config-examples/gen-docker-certs.sh. A worker needs six of the bundle files:
#   docker-ca-cert.pem, docker-server-cert.pem, docker-server-key.pem  (dockerd server)
#   zot-ca-cert.pem, zot-worker-cert.pem, zot-worker-key.pem           (zot read-only pull)
# It gets neither a CA key nor any cmgr (zot-client / docker-client) cert.
multihost_docker_cert_src: "./docker-certs"

# The zot registry address (host:port) also used as the the /etc/docker/certs.d/<dir> name and
# the registry challenge images are tagged with. Must match CMGR_REGISTRY on the
# orchestrator.
multihost_docker_registry: "1.2.3.4:5000"

storage_quotas: yes
storage_device: "/dev/nvme1n1"

network_ip_pools: ["192.168.0.0/16"]
network_prefix_length: 29

userns_remap_enabled: yes

oci_interceptor_enabled: yes
oci_interceptor_version: "latest"
oci_interceptor_upgrade: no
oci_interceptor_flags: ["--oi-readonly-networking-mounts"]

logs_max_size: "10m"
logs_max_files: 3

container_deny_ipv4_cidrs: ["169.254.169.254/32"]

docker_reaper_enabled: yes
docker_reaper_version: "latest"
docker_reaper_upgrade: no
docker_reaper_command: "containers --filter label=cmgr.dynamic=true --min-age 60m --reap-networks"
docker_reaper_images_command: "images --threshold 80 --target 70"
docker_reaper_interval_secs: 60

cork_telemetry_enabled: yes
cork_telemetry_version: "v0.0.1"
cork_telemetry_download_url: "REPLACE_ME"
cork_telemetry_upgrade: no
