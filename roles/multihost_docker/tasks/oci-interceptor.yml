---

# Installs oci-interceptor

- name: Check whether oci-interceptor is installed
  ansible.builtin.stat:
    path: "{{ oci_interceptor_install_path }}/oci-interceptor"
  register: oci_interceptor_binary

- name: Determine installed oci-interceptor version
  ansible.builtin.shell:
    cmd: echo "v`{{ oci_interceptor_install_path }}/oci-interceptor --oi-version | cut -d ' ' -f 2,2`"
  when: (oci_interceptor_upgrade | bool) and oci_interceptor_binary.stat.exists
  register: oci_interceptor_version_output

- name: Determine latest oci-interceptor version
  ansible.builtin.uri:
    url: "{{ oci_interceptor_github_url }}/releases/latest"
    method: HEAD
    follow_redirects: safe
  register: oci_interceptor_latest_version_response
  when: oci_interceptor_version == "latest" and (not oci_interceptor_binary.stat.exists or (oci_interceptor_upgrade | bool))

- name: Determine whether (re-)installation is necessary
  ansible.builtin.set_fact:
    oci_interceptor_installation_required: "{{ (not oci_interceptor_binary.stat.exists) or ((oci_interceptor_upgrade | bool) and oci_interceptor_version != 'latest' and oci_interceptor_version_output.stdout != oci_interceptor_version) or ((oci_interceptor_upgrade | bool) and oci_interceptor_version == 'latest' and oci_interceptor_version_output.stdout != oci_interceptor_latest_version_response.url.split('/tag/')[1]) }}"

- name: Create temporary directory for download
  ansible.builtin.tempfile:
    state: directory
  register: oci_interceptor_download_dir
  when: oci_interceptor_installation_required

- name: Download oci-interceptor binary
  ansible.builtin.get_url:
    dest: "{{ oci_interceptor_download_dir.path }}"
    url: "{{ oci_interceptor_github_url }}/releases/download/{{ oci_interceptor_latest_version_response.url.split('/tag/')[1] if oci_interceptor_version == 'latest' else oci_interceptor_version }}/{{ oci_interceptor_binary_filename }}"
  when: oci_interceptor_installation_required

- name: Unpack oci-interceptor binary
  ansible.builtin.unarchive:
    dest: "{{ oci_interceptor_download_dir.path }}"
    remote_src: yes
    src: "{{ oci_interceptor_download_dir.path }}/{{ oci_interceptor_binary_filename }}"
  when: oci_interceptor_installation_required

- name: Copy oci-interceptor binary to install location
  ansible.builtin.copy:
    src: "{{ oci_interceptor_download_dir.path }}/oci-interceptor"
    dest: "{{ oci_interceptor_install_path }}/oci-interceptor"
    mode: "0755"
    remote_src: yes
  when: oci_interceptor_installation_required

- name: Remove temporary directory
  ansible.builtin.file:
    path: "{{ oci_interceptor_download_dir.path }}"
    state: absent
  when: oci_interceptor_installation_required

# Deployed regardless of whether the binary itself was (re-)installed, since the flag set
# can change without the version changing.
#
# Deliberately does NOT notify Restart Docker. With runtimeArgs gone, dockerd records only
# the runtime *path* and hands it to containerd as BinaryName; the script itself is read by
# the kernel at every exec, so a flags-only edit takes effect on the next container with no
# daemon restart. Restarting would stop every running challenge container (live-restore is
# not enabled) for no reason. On the migration run daemon.json changes too, and config.yml
# notifies the restart then.
- name: Ensure oci-interceptor runtime wrapper exists
  ansible.builtin.template:
    src: "oci_interceptor_runtime.sh.j2"
    dest: "{{ oci_interceptor_wrapper_path }}"
    mode: "0755"
    force: yes

# The wrapper removes Docker's generated non-exec /bin/sh layer, but the interceptor
# spawning rather than exec'ing runc is a second, independent layer that only a newer
# binary fixes. Nothing breaks on an older one -- the flag is still accepted -- so this
# warns rather than gating, unlike the docker-reaper shim sweep which would fail its unit.
- name: Determine the installed oci-interceptor version
  ansible.builtin.command:
    cmd: "{{ oci_interceptor_install_path }}/oci-interceptor --oi-version"
  register: oci_interceptor_current_version
  changed_when: false
  check_mode: false
  failed_when: false

- name: Warn when the installed oci-interceptor still orphans shims
  ansible.builtin.debug:
    msg: >-
      The installed oci-interceptor reports
      "{{ oci_interceptor_current_version.stdout | default('') | trim | default('unknown', true) }}",
      which predates {{ oci_interceptor_min_version }}. The runtime wrapper removes Docker's
      generated non-exec layer, but this binary still spawns rather than execs the runtime, so
      cancelled runtime calls will keep orphaning containerd shims. Apply once with
      oci_interceptor_upgrade=yes to pick up a newer binary.
  vars:
    _oci_interceptor_version: >-
      {{ ((oci_interceptor_current_version.stdout | default('')).split()
          | last | default('', true)) | regex_replace('^v', '') }}
  when: >-
    (oci_interceptor_current_version.rc | default(1)) != 0
    or not (_oci_interceptor_version is match('^[0-9]+(\.[0-9]+)*$'))
    or not (_oci_interceptor_version is version(oci_interceptor_min_version, '>='))
