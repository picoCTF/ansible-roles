---

# Install Docker Engine

- name: Ensure GPG dependencies are installed
  ansible.builtin.apt:
    name:
      - apt-transport-https
      - ca-certificates
      - curl
      - gnupg-agent
      - software-properties-common
    state: present
    update_cache: yes

- name: Ensure apt keyrings directory exists
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: '0755'

- name: Ensure Docker repository GPG key is present
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: '0644'

- name: Ensure docker.list is removed to clear any conflicting repository configurations
  ansible.builtin.file:
    path: /etc/apt/sources.list.d/docker.list
    state: absent

- name: Ensure stable Docker repository is added
  ansible.builtin.apt_repository:
    repo: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu {{ ansible_facts['distribution_release'] }} stable"
    filename: docker
    state: present

# The nftables backend execs /usr/sbin/nft rather than linking libnftables, so
# the binary has to be on the host. docker-ce depends on the package on Ubuntu,
# but state it here: this role is what decides to use the backend, and a missing
# nft would otherwise surface as dockerd failing to program any rule at all.
- name: Ensure the nftables package is installed
  ansible.builtin.apt:
    name: nftables
    state: present
    update_cache: yes
  when: docker_firewall_backend == "nftables"

- name: Gather installed package facts
  ansible.builtin.package_facts:
    manager: apt

- name: Ensure Docker packages are unheld
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: install
  loop:
    - docker-ce
    - docker-ce-cli
  when:
    - not (docker_pin_version | bool)
    - item in ansible_facts.packages

# Pinned packages
- name: Ensure Docker Engine is pinned to specific version
  ansible.builtin.apt:
    name:
      - "docker-ce={{ docker_version_pin_map[ansible_facts['distribution_release']] }}"
      - "docker-ce-cli={{ docker_version_pin_map[ansible_facts['distribution_release']] }}"
    state: present
    allow_downgrade: yes
    update_cache: yes
  notify:
    - Restart Docker
  when: (docker_pin_version | bool)

# Checked against what is installed rather than against the pin: an unpinned
# host takes whatever the repository offers, and 28.x accepts
# "firewall-backend": "nftables" in daemon.json and goes on programming
# iptables, so the failure this guards against is silent.
- name: Fail if the nftables backend was requested on a Docker too old to implement it
  vars:
    # package_facts reports the full apt version, epoch and revision included
    # (5:29.6.0-1~ubuntu.24.04~noble). Only the upstream part is comparable.
    docker_upstream_version: >-
      {{ ansible_facts.packages['docker-ce'][0].version
         | default('0') | regex_replace('^[0-9]+:', '') | regex_replace('-.*$', '') }}
  ansible.builtin.assert:
    that:
      - "'docker-ce' in ansible_facts.packages"
      - docker_upstream_version is version(docker_nftables_min_version, '>=')
    fail_msg: >-
      docker_firewall_backend is 'nftables' but the installed docker-ce is
      {{ ansible_facts.packages['docker-ce'][0].version | default('absent') }}
      (upstream {{ docker_upstream_version }}), below {{ docker_nftables_min_version }}.
      Releases before that either have no nftables bridge firewaller at all (28.x, which
      silently keeps programming iptables) or abort on a netlink socket with a file
      descriptor over 1024 (29.0-29.5, moby#52873).
  when: docker_firewall_backend == "nftables"

- name: Hold Docker packages at current version
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - docker-ce
    - docker-ce-cli
  when: (docker_pin_version | bool)

- name: Ensure Docker Engine is installed (unpinned)
  ansible.builtin.apt:
    name:
      - docker-ce
      - docker-ce-cli
    state: "{{ 'latest' if (upgrade | bool) else 'present' }}"
  notify:
    - Restart Docker
  when: not (docker_pin_version | bool)

# Other unpinned
- name: Ensure Docker plugins and containerd are installed
  ansible.builtin.apt:
    name:
      - containerd.io
      - docker-buildx-plugin
      - docker-compose-plugin
    state: "{{ 'latest' if (upgrade | bool) else 'present' }}"
  notify:
    - Restart Docker
