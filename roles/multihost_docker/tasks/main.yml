---

# First, so a docker-reaper release below the role's floor fails the play before the
# host changes. See the file for why docker-reaper.yml itself is too late.
- ansible.builtin.include_tasks: docker-reaper-preflight.yml
  when: docker_reaper_enabled | bool
  args:
    apply:
      become: yes

# Likewise: a crun pin below the floor, or an architecture with no asset, fails here rather
# than seven includes later once the host has been changed. Not gated on crun_enabled,
# because the drain warning at the end has to fire when it is being turned OFF too -- that
# direction strands crun-created containers exactly the same way.
- ansible.builtin.include_tasks: crun-preflight.yml
  when: oci_interceptor_enabled | bool
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: install.yml
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: group.yml
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: certs.yml
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: storage.yml
  when: storage_quotas | bool
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: parent-cgroup.yml
  args:
    apply:
      become: yes

# Before oci-interceptor.yml, which writes the wrapper naming the crun binary. The
# decisions this acts on were all made in crun-preflight.yml.
- ansible.builtin.include_tasks: crun.yml
  when: (oci_interceptor_enabled | bool) and (crun_enabled | bool)
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: oci-interceptor.yml
  when: oci_interceptor_enabled | bool
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: firewall.yml
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: sysctls.yml
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: config.yml
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: docker-reaper.yml
  when: docker_reaper_enabled | bool
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: telemetry.yml
  when: cork_telemetry_enabled | bool
  args:
    apply:
      become: yes

- ansible.builtin.meta: flush_handlers

- name: Ensure Docker service is active
  ansible.builtin.service:
    name: docker
    state: started
  become: yes
  register: docker_service
  until: docker_service.status.ActiveState == "active"

- name: Ensure ufw service is active
  ansible.builtin.service:
    name: ufw
    state: started
  become: yes
  register: ufw_service
  until: ufw_service.status.ActiveState == "active"

- name: Ensure telemetry service is active
  ansible.builtin.service:
    name: telemetry.service
    state: started
  become: yes
  register: telemetry_service
  until: telemetry_service.status.ActiveState == "active"
  when: cork_telemetry_enabled | bool
