---

# Blocks access to certain CIDRs from inside Docker containers.
#
# How that is done depends on which firewall backend dockerd is running. On the
# iptables backend the rules go into the DOCKER-USER chain, which Docker creates
# and consults before its own accept rules, via ufw's after.rules. On the
# nftables backend that chain does not exist -- docker 29 creates
# `table ip docker-bridges` and `table ip6 docker-bridges` and nothing matching
# "user" -- so the same rules live in a table of this role's own, hooked into
# `forward` well before anything Docker registers.
#
# Both branches remove the other's artifacts, so a host may be moved between
# backends without leaving a dead ruleset that reads as though it were filtering.

# BEFORE ufw is touched, and this ordering is load-bearing.
#
# `ufw enable` runs iptables-restore over after.rules. On the nftables backend
# DOCKER-USER does not exist, so a host still carrying those lines -- every host
# being migrated from the iptables backend -- fails that task, and the play dies
# here, before reaching any task that could clean them up. It then fails the same
# way on every re-run: the migration is impossible without hand-editing the file.
#
# Removes EVERY ansible-managed DOCKER-USER block, not the ones whose CIDR is
# still in container_deny_ipv4_cidrs: a CIDR dropped from the list leaves a block
# no loop can name any more, and one leftover line is enough to make
# iptables-restore reject the whole file.
- name: Remove every ansible-managed DOCKER-USER container egress block from ufw
  ansible.builtin.replace:
    path: /etc/ufw/after.rules
    regexp: '(?m)^# BEGIN ANSIBLE MANAGED BLOCK [^\n]*\n-I DOCKER-USER [^\n]*\n# END ANSIBLE MANAGED BLOCK [^\n]*\n'
    replace: ''
  when: docker_firewall_backend == "nftables"

- name: Ensure ufw is enabled (with default-allow policy)
  community.general.ufw:
    state: enabled
    policy: allow

# ------------------------------------------------------------ iptables backend

- name: Configure container egress denials on the iptables backend
  when: docker_firewall_backend == "iptables"
  block:
    # Restores the distro default. On this backend Docker's own ACCEPT rules make
    # ufw's FORWARD policy irrelevant to container traffic, so DROP is both the
    # status quo and the safer setting to leave behind if a host is moved back
    # from the nftables backend.
    - name: Ensure ufw's forwarded-traffic policy is the distro default
      community.general.ufw:
        policy: deny
        direction: routed
      notify:
        - Reload ufw

    - name: Ensure ufw.service drop-in directory exists
      ansible.builtin.file:
        path: "{{ systemd_ufw_drop_in_dir }}"
        state: directory

    # Modifies ufw.service to start after docker.service, so that the DOCKER-USER iptables chain exists to modify.
    - name: Ensure ufw.service drop-in unit exists
      ansible.builtin.copy:
        src: "ufw.service_override.conf"
        dest: "{{ systemd_ufw_drop_in_dir }}/override.conf"
        force: yes
      notify:
        - Reload systemd config

    # One block holding every CIDR, rather than a block per CIDR. With a marker
    # per CIDR, dropping one from container_deny_ipv4_cidrs left its block in
    # place for ever: no later loop names it, so nothing removes it and the host
    # goes on rejecting traffic the operator meant to allow. A single block is
    # rewritten whole on every change.
    - name: Ensure any per-CIDR container egress blocks from earlier runs are gone
      ansible.builtin.replace:
        path: /etc/ufw/after.rules
        regexp: '(?m)^# BEGIN ANSIBLE MANAGED BLOCK (?!container egress)[^\n]*\n-I DOCKER-USER [^\n]*\n# END ANSIBLE MANAGED BLOCK [^\n]*\n'
        replace: ''
      notify:
        - Reload ufw

    - name: Drop traffic from containers to all specified IPv4 CIDRs
      ansible.builtin.blockinfile:
        path: /etc/ufw/after.rules
        marker: "# {mark} ANSIBLE MANAGED BLOCK container egress"
        block: |-
          {% for cidr in container_deny_ipv4_cidrs %}
          -I DOCKER-USER -d {{ cidr }} -j REJECT -m comment --comment "Ansible managed"
          {% endfor %}
        insertbefore: "COMMIT"
        state: "{{ 'present' if container_deny_ipv4_cidrs | length > 0 else 'absent' }}"
      notify:
        - Reload ufw

    # IPv6 is not enabled by default in Docker, so no ip6tables DOCKER-USER chain typically(?) exists.
    # container_deny_ipv6_cidrs is therefore only honoured on the nftables backend, whose table covers
    # both families at once.
    - name: Fail if IPv6 denials were requested on the iptables backend
      ansible.builtin.assert:
        that: container_deny_ipv6_cidrs | length == 0
        fail_msg: >-
          container_deny_ipv6_cidrs is set but docker_firewall_backend is 'iptables', which has no
          ip6tables DOCKER-USER chain to insert into. Either clear the list or move this host to the
          nftables backend, whose inet table covers both families.

    - name: Ensure the nftables container egress filter is not left loaded
      ansible.builtin.systemd:
        name: "{{ nft_egress_service }}"
        state: stopped
        enabled: no
      failed_when: false

    - name: Ensure the nftables container egress unit and ruleset are absent
      ansible.builtin.file:
        path: "{{ item }}"
        state: absent
      loop:
        - "{{ systemd_unit_dir }}/{{ nft_egress_service }}"
        - "{{ nft_egress_conf_path }}"
      notify:
        - Reload systemd config

# ------------------------------------------------------------ nftables backend

- name: Configure container egress denials on the nftables backend
  when: docker_firewall_backend == "nftables"
  block:
    # On the iptables backend Docker inserts its own ACCEPT rules into the same
    # `filter` table ufw writes to, so ufw's FORWARD policy of DROP never applies
    # to container traffic. On the nftables backend Docker's rules move to
    # `table ip docker-bridges` and ufw's FORWARD chain still has `policy drop`,
    # which silently kills ALL container egress -- measured on Docker 29.8: a
    # container could not reach 8.8.8.8 until this was relaxed. The container
    # egress denials are enforced by this role's own inet table, not by ufw's
    # default, so allowing routed traffic here loses nothing.
    #
    # Note the scope: this is ufw's GLOBAL routed policy, not a docker-only rule.
    # ufw has no stable handle for Docker's bridges -- user-defined networks get a
    # br-<id> interface created at runtime -- so there is nothing to scope to at
    # deploy time. That is acceptable on a single-purpose worker, which forwards
    # nothing but container traffic. A host that also routes for something else
    # (a second NIC, a VPN) needs a narrower rule instead: `ufw route allow` from
    # the container address pools in network_ip_pools.
    - name: Ensure ufw does not drop forwarded container traffic
      community.general.ufw:
        policy: allow
        direction: routed
      notify:
        - Reload ufw

    - name: Ensure the nftables include directory exists
      ansible.builtin.file:
        path: "{{ nft_egress_conf_path | dirname }}"
        state: directory
        mode: '0755'

    - name: Ensure the container egress ruleset is present
      ansible.builtin.template:
        src: container_egress.nft.j2
        dest: "{{ nft_egress_conf_path }}"
        mode: '0644'
        # nft parses the whole file as one transaction, so a template that does
        # not load leaves the previous ruleset in place rather than a partial one.
        validate: /usr/sbin/nft -c -f %s
      register: nft_egress_ruleset

    - name: Ensure the container egress unit is present
      ansible.builtin.template:
        src: container_egress.service.j2
        dest: "{{ systemd_unit_dir }}/{{ nft_egress_service }}"
        mode: '0644'
      notify:
        - Reload systemd config

    - name: Ensure the container egress filter is enabled and loaded
      ansible.builtin.systemd:
        name: "{{ nft_egress_service }}"
        enabled: yes
        state: started
        daemon_reload: yes
      register: nft_egress_unit

    # Deliberately not a handler. A handler runs at flush_handlers, so a play
    # that fails anywhere between the template above and the end of the run
    # leaves the kernel holding the previous ruleset while the file on disk says
    # otherwise -- and the NEXT run finds the file unchanged, never notifies, and
    # the divergence is permanent. Applying it here costs one systemctl call and
    # makes the file and the kernel agree before anything else can fail.
    #
    # `state: started` above does not do it: on a host where the unit is already
    # running that is a no-op, and the unit is what loads the ruleset.
    - name: Load the container egress ruleset now if it changed
      ansible.builtin.systemd:
        name: "{{ nft_egress_service }}"
        state: reloaded
      when: nft_egress_ruleset is changed and not (nft_egress_unit is changed)

    # The ufw rules for the iptables backend are removed rather than left in
    # place: on this backend DOCKER-USER does not exist, so `iptables-restore`
    # fails on the whole after.rules file and every later `ufw reload` is a
    # no-op -- which would silently drop whatever port policy ufw is also
    # carrying, not just these lines.
    # ufw no longer has to wait for Docker to create a chain for it.
    - name: Remove the ufw-after-docker drop-in
      ansible.builtin.file:
        path: "{{ systemd_ufw_drop_in_dir }}/override.conf"
        state: absent
      notify:
        - Reload systemd config
