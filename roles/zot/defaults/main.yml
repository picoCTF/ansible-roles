---
zot_version: "v2.1.22"

# sha256 of each release asset, from the release's checksums.sha256.txt. Raising
# zot_version means adding its entry here; a version with no entry fails the play
# rather than installing unverified.
zot_checksums:
  v2.1.22:
    amd64: "sha256:33b9b5bfe05d6788c076de951a01920477dbd6395c330146e23cc2340073e52e"
    arm64: "sha256:abc9bab13c144a4ee2f9067a6bbbe70ca1c018c49dbf521db28975514ea705da"
# Overrides zot_checksums, for a version the role does not list.
zot_checksum: ""

# The role refuses to install a release older than the one already installed.
zot_allow_downgrade: no

zot_service_enabled: yes
zot_address: "0.0.0.0"
zot_port: "5000"
zot_log_level: "warning"

# Write zot's log to a file instead of stdout (the journal), and an audit log of
# writes, with the client's identity, to a file of its own. Both go to /var/log/zot
# and are rotated by logrotate. Requests are logged at "info"; at "warning" the log
# file holds none. The audit log needs "info" or lower to record anything.
zot_log_file: no
zot_audit_log: no

# HTTP read and write deadlines, as Go duration strings. zot's own default for
# both is 60s, and that is a deadline on the WHOLE request rather than an idle
# timeout -- so it bounds how long a single blob may take to transfer, however
# fast the bytes are moving.
#
# 60s is too short for container images. A 2 GB layer has to sustain ~34 MB/s
# end to end to finish inside it, and a push that does not is cut off mid-body:
# zot logs
#
#   {"message":"unexpected error, removing .uploads/ files",
#    "error":"read tcp ...: i/o timeout","func":"...PatchBlobUpload"}
#
# and the pushing daemon sees "use of closed network connection". docker then
# retries and fails identically every time, so it reads as a broken registry
# rather than a deadline. Raising the instance size does not help; the deadline
# is wall clock.
#
# 30m, not 0. Zero disables the deadline entirely, which zot warns leaves it
# open to stalled connections -- and a bound that no honest push can reach is
# worth keeping. writeTimeout matters for the other direction, where many
# workers pull large images at launch.
zot_read_timeout: "30m"
zot_write_timeout: "30m"

# Service account zot runs as. Created by the role: a system user with no login shell that
# owns the image store.
zot_user: "zot"

# Image store. When zot_storage_device is set, that block device is formatted as XFS and
# mounted at zot_storage_root before zot starts, so the store lives on its own volume
# rather than the root filesystem.
zot_storage_root: "/var/lib/zot"
zot_storage_device: null

# nofail keeps a volume that will not mount off local-fs.target, so the host boots
# and can be logged into. Safe only because zot.service requires the mount, so an
# unmounted store stops zot rather than letting it serve an empty one from the
# root filesystem.
zot_storage_mount_options: "defaults,noatime,nofail,x-systemd.device-timeout=30s"

zot_deploy_certs: yes
zot_cert_src: "./docker-certs"

# CNs of the workers' read-only client certificates. A name left off this list
# is refused, which is how a leaked worker certificate is revoked. List the old
# and new names together while workers roll onto a re-issued certificate.
zot_worker_identities: ["worker"]
