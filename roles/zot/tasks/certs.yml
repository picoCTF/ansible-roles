---

# Deploy the registry's server-only TLS material from the controller. zot holds NO
# client cert. Files are generated by config-examples/gen-docker-certs.sh and staged on
# the Ansible controller under {{ zot_cert_src }}. The server key is delivered to the
# service at runtime via systemd LoadCredential (see zot.service.j2).

- name: Deploy zot CA certificate (verify cmgr/worker client certs)
  ansible.builtin.copy:
    src: "{{ zot_cert_src }}/zot-ca-cert.pem"
    dest: "{{ zot_config_dir }}/zot-ca-cert.pem"
    mode: "0444"
  notify:
    - Restart zot

- name: Deploy zot server certificate
  ansible.builtin.copy:
    src: "{{ zot_cert_src }}/zot-server-cert.pem"
    dest: "{{ zot_config_dir }}/zot-server-cert.pem"
    mode: "0444"
  notify:
    - Restart zot

- name: Deploy zot server key
  ansible.builtin.copy:
    src: "{{ zot_cert_src }}/zot-server-key.pem"
    dest: "{{ zot_config_dir }}/zot-server-key.pem"
    mode: "0400"
  notify:
    - Restart zot
