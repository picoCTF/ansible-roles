---

# Image store: optionally a dedicated XFS volume mounted at zot_storage_root, always owned
# by the zot service user.

# Earlier versions of this role ran zot under DynamicUser with StateDirectory=zot, which
# leaves zot_storage_root as a symlink into /var/lib/private. A mount cannot sit on a
# symlink, so stop the old service and remove the link first. Images already pushed are
# not migrated, and cork only pushes at build time: repopulate by re-pushing the current
# tags from the orchestrator's build daemon or by forcing a rebuild.
- name: Check the current state of the image store path
  ansible.builtin.stat:
    path: "{{ zot_storage_root }}"
  register: zot_storage_root_stat

- name: Stop zot before replacing a DynamicUser state symlink
  ansible.builtin.service:
    name: zot.service
    state: stopped
  register: zot_stop_for_migration
  failed_when: zot_stop_for_migration is failed and not "Could not find the requested service" in zot_stop_for_migration.msg
  when: zot_storage_root_stat.stat.islnk | default(false)

- name: Remove the DynamicUser state symlink
  ansible.builtin.file:
    path: "{{ zot_storage_root }}"
    state: absent
  when: zot_storage_root_stat.stat.islnk | default(false)

# The volume is found by device and mounted thereafter by filesystem UUID.
# zot_storage_device is only used to format, read and grow it; fstab names the
# UUID. That is what makes an image of this host clonable: the by-id path AWS
# gives an EBS volume is built from the volume ID, and a snapshot restores to a
# new volume with a new ID, so an image whose fstab named a device comes up with
# a correct, fully populated store that nothing mounts. A UUID lives in the
# filesystem superblock, so a block-level snapshot carries it.
- name: Ensure the image store volume is formatted as XFS
  community.general.filesystem:
    dev: "{{ zot_storage_device }}"
    fstype: xfs
  when: zot_storage_device | default('', true) | length > 0

- name: Read the image store volume's filesystem UUID
  # -c /dev/null bypasses blkid's cache, which can still name a volume that has
  # been replaced.
  ansible.builtin.command:
    argv: ["blkid", "-c", "/dev/null", "-s", "UUID", "-o", "value", "{{ zot_storage_device }}"]
  register: zot_storage_uuid
  changed_when: false
  when: zot_storage_device | default('', true) | length > 0

- name: Fail rather than write an fstab entry with no UUID
  # The one failure this has to catch: an empty read becomes "UUID=" in fstab,
  # which leaves the store unmounted at the next boot rather than now.
  ansible.builtin.assert:
    that:
      - zot_storage_uuid.stdout | trim is match('^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$')
    fail_msg: >-
      blkid read no filesystem UUID from {{ zot_storage_device }}
      (got {{ zot_storage_uuid.stdout | trim | default('nothing', true) }}).
      Writing that to fstab would leave {{ zot_storage_root }} unmounted at the
      next boot, so the play stops here instead.
  when: zot_storage_device | default('', true) | length > 0

- name: Ensure the image store volume is mounted
  ansible.posix.mount:
    path: "{{ zot_storage_root }}"
    src: "UUID={{ zot_storage_uuid.stdout | trim }}"
    fstype: xfs
    opts: defaults,noatime
    state: mounted
  when: zot_storage_device | default('', true) | length > 0

- name: Grow the image store filesystem if necessary
  # community.general.filesystem cannot grow XFS filesystems unless they are already
  # mounted, hence this additional invocation after ansible.posix.mount.
  community.general.filesystem:
    dev: "{{ zot_storage_device }}"
    fstype: xfs
    resizefs: yes
  when: zot_storage_device | default('', true) | length > 0

- name: Ensure the image store is owned by the zot user
  ansible.builtin.file:
    path: "{{ zot_storage_root }}"
    state: directory
    owner: "{{ zot_user }}"
    group: "{{ zot_user }}"
    mode: "0750"
