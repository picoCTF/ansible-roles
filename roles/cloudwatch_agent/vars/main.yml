---
# If we write the config file to the default path
# (/opt/aws/amazon-cloudwatch-agent/etc/amazon-cloudwatch-agent.json)
# recommended by the docs[0], it is copied into amazon-cloudwatch-agent.d and
# deleted each time the agent is called with `-a fetch-config`.
#
# We want to keep the original config file around so that it can be fetched each
# time the systemd service is restarted, and so that Ansible can detect whether
# any changes have been made since it was last templated. By storing it
# one directory level higher, in /opt/aws/amazon-cloudwatch-agent/, it no
# longer gets deleted after being fetched.
#
# [0](https://docs.aws.amazon.com/AmazonCloudWatch/latest/monitoring/CloudWatch-Agent-Configuration-File-Details.html)
config_file_path: "/opt/aws/amazon-cloudwatch-agent/config.json"

systemd_unit_dir: "/etc/systemd/system/"

# The agent .deb, by architecture. AWS publishes one per platform under the same
# path, and apt refuses a package built for another architecture outright ("Wrong
# architecture 'amd64'"), so a Graviton host needs the arm64 URL rather than a
# dpkg --add-architecture workaround.
cloudwatch_agent_arch_map:
  x86_64: amd64
  aarch64: arm64
cloudwatch_agent_arch: "{{ cloudwatch_agent_arch_map[ansible_facts['architecture']] | default('') }}"
cloudwatch_agent_deb_url: "https://s3.amazonaws.com/amazoncloudwatch-agent/ubuntu/{{ cloudwatch_agent_arch }}/latest/amazon-cloudwatch-agent.deb"

# systemd spells architectures its own way, and ConditionArchitecture silently
# skips a unit whose value does not match -- so an arm64 host with the x86-64
# condition installs a service that never starts and reports no error of its own.
cloudwatch_agent_condition_architecture_map:
  amd64: x86-64
  arm64: arm64
cloudwatch_agent_condition_architecture: "{{ cloudwatch_agent_condition_architecture_map[cloudwatch_agent_arch] | default('') }}"
