---

# Installs oci-interceptor

- name: Check whether oci-interceptor is installed
  ansible.builtin.stat:
    path: "{{ oci_interceptor_install_path }}/oci-interceptor"
  register: oci_interceptor_binary

- name: Determine installed oci-interceptor version
  ansible.builtin.command:
    cmd: "{{ oci_interceptor_install_path }}/oci-interceptor --oi-version"
  when: (oci_interceptor_upgrade | bool) and oci_interceptor_binary.stat.exists
  register: oci_interceptor_version_output
  changed_when: false

# The probe prints "<name> <version>" and releases are tagged v<version>. It was
# a shell pipeline through cut, but the task's exit status came from echo rather
# than the probe -- so a probe that failed reported success and compared as a
# bare "v", silently forcing a reinstall instead of failing the play.
- name: Record the installed oci-interceptor version
  ansible.builtin.set_fact:
    oci_interceptor_probed_version: "v{{ (probe | trim).split(' ')[1] if (probe | trim).split(' ') | length > 1 else (probe | trim) }}"
  vars:
    probe: "{{ oci_interceptor_version_output.stdout | default('') }}"
  when: (oci_interceptor_upgrade | bool) and oci_interceptor_binary.stat.exists

- name: Determine latest oci-interceptor version
  ansible.builtin.uri:
    url: "{{ oci_interceptor_github_url }}/releases/latest"
    method: HEAD
    follow_redirects: safe
  register: oci_interceptor_latest_version_response
  when: oci_interceptor_version == "latest" and (not oci_interceptor_binary.stat.exists or (oci_interceptor_upgrade | bool))

- name: Determine whether (re-)installation is necessary
  ansible.builtin.set_fact:
    oci_interceptor_installation_required: "{{ (not oci_interceptor_binary.stat.exists) or ((oci_interceptor_upgrade | bool) and oci_interceptor_version != 'latest' and oci_interceptor_probed_version != oci_interceptor_version) or ((oci_interceptor_upgrade | bool) and oci_interceptor_version == 'latest' and oci_interceptor_probed_version != oci_interceptor_latest_version_response.url.split('/tag/')[1]) }}"

- name: Create temporary directory for download
  ansible.builtin.tempfile:
    state: directory
  register: oci_interceptor_download_dir
  when: oci_interceptor_installation_required

- name: Download oci-interceptor binary
  ansible.builtin.get_url:
    dest: "{{ oci_interceptor_download_dir.path }}"
    url: "{{ oci_interceptor_github_url }}/releases/download/{{ oci_interceptor_latest_version_response.url.split('/tag/')[1] if oci_interceptor_version == 'latest' else oci_interceptor_version }}/{{ oci_interceptor_binary_filename }}"
    mode: "0644"
  when: oci_interceptor_installation_required

- name: Unpack oci-interceptor binary
  ansible.builtin.unarchive:
    dest: "{{ oci_interceptor_download_dir.path }}"
    remote_src: yes
    src: "{{ oci_interceptor_download_dir.path }}/{{ oci_interceptor_binary_filename }}"
  when: oci_interceptor_installation_required

- name: Copy oci-interceptor binary to install location
  ansible.builtin.copy:
    src: "{{ oci_interceptor_download_dir.path }}/oci-interceptor"
    dest: "{{ oci_interceptor_install_path }}/oci-interceptor"
    mode: "0755"
    remote_src: yes
  when: oci_interceptor_installation_required

- name: Remove temporary directory
  ansible.builtin.file:
    path: "{{ oci_interceptor_download_dir.path }}"
    state: absent
  when: oci_interceptor_installation_required

# Deployed regardless of whether the binary itself was (re-)installed, since the flag set
# can change without the version changing. Deliberately does not notify Restart Docker:
# dockerd records only the runtime path, and the script is read at every exec, so a
# flags-only edit needs no daemon restart.
- name: Ensure oci-interceptor runtime wrapper exists
  ansible.builtin.template:
    src: "oci_interceptor_runtime.sh.j2"
    dest: "{{ oci_interceptor_wrapper_path }}"
    mode: "0755"
    force: yes
