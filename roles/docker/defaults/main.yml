---
docker_group_users: []
upgrade: no

docker_pin_version: false

tls_access: yes
tls_expiration_days: 3650
tls_sans: ["DNS:localhost", "IP:127.0.0.1", "DNS:host.docker.internal"]
tls_renew_certs: no
tls_fetch_certs: yes
tls_fetched_cert_path: "./fetched/certs"

storage_quotas: yes
storage_device: "/dev/nvme1n1"

network_ip_pools: ["192.168.0.0/16"]
network_prefix_length: 29

userns_remap_enabled: yes

oci_interceptor_enabled: yes
oci_interceptor_version: "latest"
oci_interceptor_upgrade: no
oci_interceptor_flags: ["--oi-readonly-networking-mounts"]

logs_max_size: "10m"
logs_max_files: 3

# BuildKit build cache garbage collection (the "builder" block of daemon.json).
#
# Off by default, and meaningless on a host that does not build: only the cork
# orchestrator does, and the docker_builder role is what turns this on. See that
# role for the sizing.
builder_gc_enabled: no
# Policy entries, applied in order, rendered verbatim into daemon.json.
#
# CONSTRAINT, and it is not a style preference: dockerd accepts at most ONE
# value per policy entry's filter. A two-value filter -- the form BuildKit's own
# documented default policy uses -- makes dockerd refuse to start with
#
#   error initializing buildkit: error creating buildkit instance:
#   filters expect only one value
#
# and it fails at daemon start, so a bad value here takes the builder down
# rather than being ignored. Split a multi-value filter into one entry per
# value. tasks/config.yml asserts this before writing the file.
builder_gc_policy: []
# Lowest Docker that understands the reservedSpace/maxUsedSpace/minFreeSpace
# field names. Conservative, not a measured boundary: those spellings arrived
# with BuildKit v0.16, which Docker 27.4 was the first to ship, and 29.8 is what
# this was actually verified against. An older daemon ignores them rather than
# rejecting them, which would leave GC on with entries that constrain nothing,
# so tasks/config.yml refuses instead. Lower it only alongside a test on the
# version you are lowering it to.
builder_gc_min_docker_version: "28.0.0"

container_deny_ipv4_cidrs: ["169.254.169.254/32"]
container_deny_ipv6_cidrs: []

# Which firewall dockerd programs: "nftables" or "iptables".
#
# nftables measured ~7x the launch throughput of iptables on this fleet's
# workload -- the iptables lock serialises dockerd's per-container rule
# batches -- so it is the default, here as in multihost_docker. Set "iptables"
# to fall back.
#
# This role has a wider spread of hosts than that one: the classroom boxes, the
# webshell toolboxes and the long-lived challenge servers, not just the build
# plane. The floor below is what makes one default safe for all of them, and it
# is a floor on what is INSTALLED, not on the pin -- docker_pin_version is false
# everywhere, so the pin binds nothing and `upgrade` defaults to no. A host
# provisioned before 29.6.0 and never touched since fails the assert rather than
# misconfiguring itself, which is the behaviour to want, but it does mean the
# play stops there until that host is upgraded.
#
# The course boxes reach it later than the rest: they are held stable for the
# length of a semester rather than re-run, so this takes effect on them at the
# next deployment, on a fresh host, which is the easy direction to flip in.
#
# What differs between the backends, and what the role does about it:
#   * nftables needs Docker >= docker_nftables_min_version (see vars/main.yml).
#     The backend arrived in 29.0.0,
#     but 29.0-29.5 link libnftables and abort once a netlink socket lands on
#     fd >= 1024 (moby#52873, which containers on user-defined networks reach);
#     29.6.0 execs the nft binary instead (moby#52886). 28.x reads the setting
#     and silently keeps programming iptables, so the role asserts the version
#     actually installed rather than trusting this.
#   * Docker does not enable net.ipv4.ip_forward on nftables, so the role sets
#     it. On the iptables backend Docker sets it itself.
#   * there is no DOCKER-USER chain on nftables, so container_deny_* moves out
#     of ufw's after.rules and into this role's own nft table. See
#     tasks/firewall.yml, which moves them in both directions.
#   * Docker does not tidy up the backend it was using before, so a host
#     switched in place keeps its old chains, still matching. Flip this on a
#     fresh instance, or roll the fleet.
docker_firewall_backend: nftables

docker_reaper_enabled: yes
docker_reaper_version: "latest"
docker_reaper_upgrade: no
docker_reaper_command: "containers --filter label=cmgr.dynamic=true --min-age 60m --reap-networks"
docker_reaper_interval_secs: 60

# Aggregate container resource ceilings (limit_docker.slice).
#
# Memory is sized as "total RAM minus what the host needs", not as a percentage
# of RAM. The Docker control plane (dockerd, containerd, and one
# containerd-shim-runc-v2 per running container) lives in system.slice, outside
# the container slice, so the host's footprint grows with container count. A
# flat percentage ignores that and lets the slice be granted more memory than
# the machine can spare, at which point the global OOM killer -- which selects
# by RSS and may pick dockerd -- fires before the slice's own limit is reached.

# The lowest MEAN container footprint this worker's shim reserve survives.
#
# Not an average, and not a per-container limit -- it never becomes a cgroup
# setting. Its only job is to decide how many containerd-shims to reserve host
# memory for, and the arithmetic works out so that the reserve is sufficient
# exactly when the fleet's actual mean container size is at or above this value.
# Below it the reserve is short, and badly: on a 4 GiB worker a 10 MiB mean
# overruns the shim budget by ~1245 MiB.
#
# Container *asymmetry* does not matter here -- a socat one-liner beside a
# multi-service stack is fine as long as the mean holds. What matters is a lower
# bound on that mean. Set it below the smallest mean you expect, not at the mean
# you observe: undershooting costs a few percent of container memory, while
# overshooting costs the worker. A live picoCTF worker measured ~48 MiB mean, so
# 30 leaves roughly 40% headroom for a shift toward smaller challenges.
container_slice_min_mean_container_mb: 30
# Container capacity this worker is sized for. Drives the memory reserve. Leave
# null to derive it from RAM. A pinned value is NOT recomputed on a resize.
container_slice_target_containers: null
# Base OS footprint outside Docker (systemd, journald, sshd, and whatever agents
# the fleet runs -- cloudwatch, ssm, snapd, atop).
container_slice_os_reserve_mb: 256
# dockerd + containerd themselves, excluding per-container shims.
#
# Measured on a production worker up 10 weeks (kernel 6.17, 5 containers running):
# docker.service anon 169 MiB + kernel 31, containerd.service anon 57 + kernel 7 --
# 264 MiB together, with anon alone already over the 192 MiB this used to reserve.
#
# Read `anon`, `file` and `kernel` from memory.stat, NOT the slab_* fields: on 6.17
# those double-count shared dentry/inode objects and exceed the cgroup's own kernel
# total, while anon + file + kernel sums to memory.current exactly.
#
# Sized for a long-lived worker rather than a fresh one. The same daemon measured
# ~133 MiB shortly after boot, so dockerd grows substantially with uptime and a
# reserve taken from a freshly booted host understates it badly.
container_slice_dockerd_reserve_mb: 320
# Interactive login sessions. These live in user.slice, not system.slice, so
# they need their own budget or an admin's ssh is the first thing reclaimed on a
# loaded worker -- the exact moment it is needed.
container_slice_user_reserve_mb: 128
# Host-side memory each running container costs OUTSIDE limit_docker.slice.
#
# Measured on Docker 29.8 / containerd 2.3 by launching 20 containers and reading
# the cgroup deltas: containerd.service grew 4.36 MiB per container (the
# containerd-shim-runc-v2) and docker.service grew 0.77 MiB per container, for
# 5.13 MiB total. 6 covers that plus headroom for dockerd's larger per-container
# state when each instance also gets its own network.
#
# Use cgroup accounting, not RSS, when re-measuring: the same 20 shims showed a
# mean VmRSS of 10.75 MiB because RSS counts their shared binary and libraries
# once per process, while the cgroup charges shared pages once.
container_slice_host_mb_per_container: 6
# Refuse to apply a configuration leaving the slice less than this.
container_slice_min_mb: 256

# Per-core CPU percentage granted to the slice in aggregate.
container_slice_cpu_percent_per_core: 80
# Scheduler weight relative to system.slice and user.slice, which stay at the
# default 100. Lower means containers yield to sshd and dockerd under
# contention. CPUQuota alone does not do this: it caps aggregate bandwidth but
# grants the host no priority, so interactive latency collapses well before the
# quota binds.
container_slice_cpu_weight: 20
# Swap available to the slice. 0 prefers killing one container over thrashing
# the whole host.
container_slice_swap_max: 0
# Aggregate TasksMax, as a percentage of kernel.threads-max.
#
# Deliberately NOT derived from container count x a per-container average: this
# is a host-survival backstop, and the invariant it enforces ("no combination of
# containers may exhaust host thread capacity") is a property of the kernel, not
# of the container mix. Averaging breaks in both directions on a heterogeneous
# fleet -- a stack-heavy mix trips a count-derived ceiling and legitimate
# challenges fail to fork, while a socat-heavy mix leaves it uselessly loose.
# Per-container fork-bomb protection is the pidslimit container option's job.
#
# kernel.threads-max is RAM-derived (roughly 6 x MemTotal in MiB) and is the real
# ceiling on a small instance; kernel.pid_max is typically far higher and never
# binds first.
container_slice_tasks_max_pct: 50

# Host memory protected from reclaim driven by container allocation.
#
# memory.min is a hard guarantee: pages the cgroup is actually using are never
# reclaimed. It does NOT reserve unused headroom -- anything the cgroup is not
# using stays fully available to every other cgroup -- so sizing it to the real
# working set costs nothing and is what actually survives sustained pressure.
# memory.low is best-effort and is given up when there is no other choice, so it
# belongs above the hard floor, not below it.
system_slice_memory_min_mb: 256
user_slice_memory_min_mb: 64

# Address of the default bridge (docker0), written as daemon.json's "bip".
#
# This is not the same question as network_prefix_length, and the two are easy to
# conflate. That one sizes the network a challenge instance gets -- five
# containers per instance at /29, which is a deliberate capacity decision. This
# one sizes the DEFAULT bridge, which on a worker nothing attaches to at all:
# cork puts every instance on a network of its own. So null is right there, and
# docker0 quietly takes a /29 out of the pool that nothing uses.
#
# A host that BUILDS is the exception, and only while it builds. BuildKit puts
# each RUN step's networking on the default bridge, so the size of docker0 bounds
# how many build steps can run at once -- five at /29, and the sixth dies with
#
#   no available IPv4 addresses on this network's address pools: bridge
#
# which reads as a docker bug rather than as an address pool being the size the
# operator asked for. docker_builder sets this; see that role for the value and
# why it is the one it is.
#
# What an overlap with network_ip_pools costs, measured on Docker 29.8 rather
# than assumed: dockerd starts either way -- this is never a startup error -- and
# the allocator SKIPS the bridge's subnet, so a bip inside a larger pool simply
# removes that much address space (bip 172.17.0.1/24 in a 172.17.0.0/16 pool at
# /29: user networks begin at 172.17.1.0/29, not at the bridge). The cost only
# becomes a failure when the pools run out: a bip that swallows a whole pool
# consumes it, and once the last one is gone `docker network create` answers
# "all predefined address pools have been fully subnetted" -- which on a
# challenge server is every launch failing while the daemon reports itself fine.
#
# Overlapping the VPC's own CIDR is the separate and worse mistake: containers
# then have a route to a range real hosts live in.
docker_bip: null
