---
- name: Reload systemd config
  ansible.builtin.systemd:
    daemon_reload: yes
  become: yes

- name: Restart Docker
  ansible.builtin.service:
    name: docker
    state: restarted
  become: yes

- name: Reload ufw
  community.general.ufw:
    state: reloaded
  become: yes

- name: Restart docker-reaper service unit
  ansible.builtin.service:
    name: docker_reaper.service
    state: restarted
  become: yes

- name: Restart docker-reaper timer unit
  ansible.builtin.service:
    name: docker_reaper.timer
    state: restarted
  become: yes

- name: Apply Docker cgroup quota
  ansible.builtin.service:
    name: docker_cgroup_quota.service
    state: restarted
  become: yes
