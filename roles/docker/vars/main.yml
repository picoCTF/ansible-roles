---
tls_cert_path: "/root/.docker_certs"  # Where to store generated TLS certs on the host machine. A subdirectory of /root is chosen so that the docker certs are not accessible even if a user manages to escape from a container (as a non-root host user, which should be the case when using user namespaces)

ca_key_path: "{{ tls_cert_path }}/ca-key.pem"
ca_csr_path: "{{ tls_cert_path }}/ca.csr"
ca_cert_path: "{{ tls_cert_path }}/ca.pem"

server_key_path: "{{ tls_cert_path }}/server-key.pem"
server_csr_path: "{{ tls_cert_path }}/server-cert.csr"
server_cert_path: "{{ tls_cert_path }}/server-cert.pem"

client_key_path: "{{ tls_cert_path }}/key.pem"
client_csr_path: "{{ tls_cert_path }}/cert.csr"
client_cert_path: "{{ tls_cert_path }}/cert.pem"

systemd_unit_dir: "/etc/systemd/system/"
systemd_docker_drop_in_dir: "/etc/systemd/system/docker.service.d"
systemd_ufw_drop_in_dir: "/etc/systemd/system/ufw.service.d"

storage_mount_point: "/mnt/docker-data"
parent_cgroup: "limit_docker.slice"
parent_cgroup_path: "/etc/systemd/system/{{ parent_cgroup }}"

oci_interceptor_install_path: "/usr/local/bin"
oci_interceptor_github_url: "https://github.com/picoCTF/oci-interceptor"
oci_interceptor_binary_filename: "oci-interceptor_x86_64-unknown-linux-gnu.tar.gz"
# dockerd invokes this instead of the binary directly, so the interceptor flags can be
# applied without daemon.json runtimeArgs. See the template for why.
oci_interceptor_wrapper_path: "{{ oci_interceptor_install_path }}/oci-interceptor-runtime"

docker_reaper_install_path: "/usr/local/bin"
docker_reaper_github_url: "https://github.com/picoCTF/docker-reaper"
docker_reaper_binary_filename: "docker-reaper-x86_64-unknown-linux-gnu.tar.gz"

# Confirm against `apt-cache madison docker-ce` before changing: the epoch and
# the distribution suffix are part of the version string apt matches on.
#
# 28.5.2 is the last release below Docker 29, and the hold is deliberate: this
# role also serves webshell toolbox hosts, and the original pin task was named
# "pinned to 28.5.2 (last < 29)". The reason was not recorded at the time --
# believed to be Docker API compatibility lag in a consumer -- so treat moving
# it as a change that needs testing rather than a version bump. multihost_docker
# pins 29.6.0 because its workers need the nftables firewall backend; that
# decision is scoped to the challenge worker fleet.
docker_version_pin_map:
  jammy: "5:28.5.2-1~ubuntu.22.04~jammy"
  noble: "5:28.5.2-1~ubuntu.24.04~noble"

# The first Docker release whose nftables backend is usable: 29.0.0 introduced
# it, but only 29.6.0 stopped linking libnftables, which aborts the daemon once
# a netlink socket gets a file descriptor >= 1024 (moby#52873).
docker_nftables_min_version: "29.6.0"

# The nftables table and loader unit that carry container_deny_* on the nftables
# backend, where there is no DOCKER-USER chain to insert into.
nft_egress_table: "container_egress"
nft_egress_conf_path: "/etc/nftables.d/container-egress.nft"
nft_egress_service: "container-egress-filter.service"

system_slice_drop_in_dir: "/etc/systemd/system/system.slice.d"
container_slice_quota_script_path: "/usr/local/sbin/docker-cgroup-quota"

# Container capacity implied by RAM, assuming a container_slice_min_mean_container_mb
# mean. An estimate: it errs low (and so under-reserves) when the real mix skews
# smaller than that mean.
container_slice_ram_capacity: >-
  {{ (((ansible_memtotal_mb | int) - (container_slice_os_reserve_mb | int)
        - (container_slice_dockerd_reserve_mb | int) - (container_slice_user_reserve_mb | int))
      // ((container_slice_min_mean_container_mb | int)
          + (container_slice_host_mb_per_container | int))) | int }}

# Effective container capacity: the operator's override when pinned, otherwise the
# RAM-derived estimate. Feeds the host reserve and nothing else.
container_slice_capacity: >-
  {{ (container_slice_target_containers | int)
     if (container_slice_target_containers is not none and (container_slice_target_containers | int) > 0)
     else [ (container_slice_ram_capacity | int), 4 ] | max }}

# Memory kept outside the container slice for the OS, interactive sessions and
# the Docker control plane. The shim term scales with container count.
container_slice_host_reserve_mb: >-
  {{ (container_slice_os_reserve_mb | int) + (container_slice_dockerd_reserve_mb | int)
     + (container_slice_user_reserve_mb | int)
     + ((container_slice_host_mb_per_container | int) * (container_slice_capacity | int)) }}

# Soft floors, derived rather than flat: system.slice is given the whole reserve
# it was budgeted minus what user.slice needs, so MemoryLow tracks instance size
# and container count instead of contradicting them.
system_slice_memory_low_mb: >-
  {{ (container_slice_host_reserve_mb | int) - (container_slice_user_reserve_mb | int) }}
user_slice_memory_low_mb: "{{ container_slice_user_reserve_mb | int }}"

user_slice_drop_in_dir: "/etc/systemd/system/user.slice.d"
