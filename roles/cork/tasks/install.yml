---

# Install cork (cmgrd daemon + cmgrd-cli client)

- name: Assert a cork download source is configured
  ansible.builtin.assert:
    that:
      - cork_github_url is defined
      - cork_github_url | length > 0
      - cork_github_url != "REPLACE_ME"
    fail_msg: >-
      cork_github_url is unset (placeholder). cork has no public release yet; point it at
      the release repo (asset {{ cork_binaries_filename }} = cmgrd + cmgrd-cli).

- name: Check whether cmgrd is installed
  ansible.builtin.stat:
    path: "{{ install_location }}/cmgrd"
  register: cmgrd_binary

- name: Determine installed cork version
  ansible.builtin.command:
    cmd: "{{ install_location }}/cmgrd-cli version"
  when: (upgrade | bool) and cmgrd_binary.stat.exists
  register: cork_version_output
  changed_when: false
  failed_when: false

- name: Determine latest cork version
  ansible.builtin.uri:
    url: "{{ cork_github_url }}/releases/latest"
    method: HEAD
    follow_redirects: safe
  register: latest_version_response
  when: version == "latest" and (not cmgrd_binary.stat.exists or (upgrade | bool))

- name: Determine whether (re-)installation is necessary
  ansible.builtin.set_fact:
    installation_required: "{{ (clean_upgrade | bool) or (not cmgrd_binary.stat.exists) or ((upgrade | bool) and version != 'latest' and cork_version_output.stdout != version) or ((upgrade | bool) and version == 'latest' and cork_version_output.stdout != latest_version_response.url.split('/tag/')[1]) }}"

- name: Create temporary directory for downloads
  ansible.builtin.tempfile:
    state: directory
  register: download_dir
  when: installation_required

- name: Download cork binaries
  ansible.builtin.get_url:
    dest: "{{ download_dir.path }}"
    url: "{{ cork_github_url }}/releases/download/{{ latest_version_response.url.split('/tag/')[1] if version == 'latest' else version }}/{{ cork_binaries_filename }}"
  when: installation_required

- name: Unpack cork binaries
  ansible.builtin.unarchive:
    dest: "{{ download_dir.path }}"
    remote_src: yes
    src: "{{ download_dir.path }}/{{ cork_binaries_filename }}"
  when: installation_required

- name: Copy cmgrd binary to install location
  ansible.builtin.copy:
    src: "{{ download_dir.path }}/cmgrd"
    dest: "{{ install_location }}/cmgrd"
    mode: "0755"
    remote_src: yes
  when: installation_required

- name: Copy cmgrd-cli binary to install location
  ansible.builtin.copy:
    src: "{{ download_dir.path }}/cmgrd-cli"
    dest: "{{ install_location }}/cmgrd-cli"
    mode: "0755"
    remote_src: yes
  when: installation_required

- name: Remove temporary directory
  ansible.builtin.file:
    path: "{{ download_dir.path }}"
    state: absent
  when: installation_required
