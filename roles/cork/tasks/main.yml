---

- ansible.builtin.include_tasks: clean-upgrade.yml
  when: (cork_upgrade | bool) and (cork_clean_upgrade | bool)
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: install.yml
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: certs.yml
  when: cork_deploy_certs | bool
  args:
    apply:
      become: yes

# corkd serves instances; a build plane runs none and has no unit.
- ansible.builtin.include_tasks: service.yml
  when: cork_daemon_enabled | bool
  args:
    apply:
      become: yes

# cork-build's environment and the destinations it routes against.
- ansible.builtin.include_tasks: build-plane.yml
  when: cork_builder_enabled | bool
  args:
    apply:
      become: yes

# The artifact server publishes what a build plane writes, so the binary and the
# unit travel together: a host that does not run it does not get it.
- ansible.builtin.include_tasks: artifact-server-install.yml
  when: artifact_server_enabled | bool
  args:
    apply:
      become: yes

- ansible.builtin.include_tasks: artifact-server-service.yml
  when: artifact_server_enabled | bool
  args:
    apply:
      become: yes

- ansible.builtin.meta: flush_handlers
