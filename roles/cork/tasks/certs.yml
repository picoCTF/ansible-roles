---

# Deploy the orchestrator's two client cert sets from the controller.
#
# cork holds the CN=cmgr client identity in BOTH trust domains: the docker-ca set
# authenticates cork to the worker dockerds (DOCKER_CERT_PATH), and the zot-ca set
# authenticates cork and its local build daemon to zot (certs.d). It never holds a CA
# key. Files are generated by config-examples/gen-docker-certs.sh and staged on the
# Ansible controller under {{ cork_cert_src }}.

- name: Ensure DOCKER_CERT_PATH directory exists
  ansible.builtin.file:
    path: "{{ docker_cert_path }}"
    state: directory
    mode: "0700"

- name: Ensure registry certs.d directory exists
  ansible.builtin.file:
    path: "{{ registry_certs_d_path }}"
    state: directory
    mode: "0700"

# docker-ca client set (cork -> worker dockerds). Landed under the names the Docker SDK
# reads from DOCKER_CERT_PATH: ca.pem / cert.pem / key.pem.

- name: Deploy docker CA certificate (verify worker server cert)
  ansible.builtin.copy:
    src: "{{ cork_cert_src }}/docker-ca-cert.pem"
    dest: "{{ docker_cert_path }}/ca.pem"
    mode: "0444"
  notify:
    - Restart cmgrd

- name: Deploy cork docker-client certificate (CN=cmgr)
  ansible.builtin.copy:
    src: "{{ cork_cert_src }}/docker-client-cert.pem"
    dest: "{{ docker_cert_path }}/cert.pem"
    mode: "0444"
  notify:
    - Restart cmgrd

- name: Deploy cork docker-client key
  ansible.builtin.copy:
    src: "{{ cork_cert_src }}/docker-client-key.pem"
    dest: "{{ docker_cert_path }}/key.pem"
    mode: "0400"
  notify:
    - Restart cmgrd

# zot-ca client set (cork + local build daemon -> zot). Under certs.d with dockerd's
# registry names: ca.crt / client.cert / client.key.

- name: Deploy zot CA certificate (verify zot server cert)
  ansible.builtin.copy:
    src: "{{ cork_cert_src }}/zot-ca-cert.pem"
    dest: "{{ registry_certs_d_path }}/ca.crt"
    mode: "0444"
  notify:
    - Restart cmgrd

- name: Deploy cork zot-client certificate (CN=cmgr, read-write)
  ansible.builtin.copy:
    src: "{{ cork_cert_src }}/zot-client-cert.pem"
    dest: "{{ registry_certs_d_path }}/client.cert"
    mode: "0444"
  notify:
    - Restart cmgrd

- name: Deploy cork zot-client key
  ansible.builtin.copy:
    src: "{{ cork_cert_src }}/zot-client-key.pem"
    dest: "{{ registry_certs_d_path }}/client.key"
    mode: "0400"
  notify:
    - Restart cmgrd
