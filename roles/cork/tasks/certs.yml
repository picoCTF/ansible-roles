---

# Deploy cork's client cert sets from the controller.
#
# cork holds the CN=cmgr client identity in TWO trust domains and needs
# whichever ones its host acts in. The docker-ca set authenticates cork to the
# worker dockerds (DOCKER_CERT_PATH), which only an orchestrator does. The
# zot-ca set authenticates it to the registry (certs.d), which both halves do: a
# build plane pushes there, and an orchestrator checks that every tag it is
# handed exists and untags what it retires -- with no docker daemon of its own
# to do either. It never holds a CA key. Files are generated by
# config-examples/gen-docker-certs.sh and staged on the Ansible controller under
# {{ cork_cert_src }}.
#
# The identity is deliberately still CN=cmgr. That name is a deployed
# certificate and zot's access policy, not a spelling: renaming it would mean
# reissuing the fleet's PKI.

# docker-ca client set (cork -> worker dockerds). Landed under the names the
# Docker SDK reads from DOCKER_CERT_PATH: ca.pem / cert.pem / key.pem.

- name: Ensure DOCKER_CERT_PATH directory exists
  ansible.builtin.file:
    path: "{{ docker_cert_path }}"
    state: directory
    mode: "0700"
  when: cork_deploy_docker_certs | bool

- name: Deploy docker CA certificate (verify worker server cert)
  ansible.builtin.copy:
    src: "{{ cork_cert_src }}/docker-ca-cert.pem"
    dest: "{{ docker_cert_path }}/ca.pem"
    mode: "0444"
  when: cork_deploy_docker_certs | bool
  notify:
    - Restart corkd

- name: Deploy cork docker-client certificate (CN=cmgr)
  ansible.builtin.copy:
    src: "{{ cork_cert_src }}/docker-client-cert.pem"
    dest: "{{ docker_cert_path }}/cert.pem"
    mode: "0444"
  when: cork_deploy_docker_certs | bool
  notify:
    - Restart corkd

- name: Deploy cork docker-client key
  ansible.builtin.copy:
    src: "{{ cork_cert_src }}/docker-client-key.pem"
    dest: "{{ docker_cert_path }}/key.pem"
    mode: "0400"
  when: cork_deploy_docker_certs | bool
  notify:
    - Restart corkd

# zot-ca client set (cork and, on a build plane, its local dockerd -> zot).
# Under certs.d with dockerd's registry names: ca.crt / client.cert / client.key.

- name: Ensure registry certs.d directory exists
  ansible.builtin.file:
    path: "{{ registry_certs_d_path }}"
    state: directory
    mode: "0700"
  when: cork_deploy_registry_certs | bool

- name: Deploy zot CA certificate (verify zot server cert)
  ansible.builtin.copy:
    src: "{{ cork_cert_src }}/zot-ca-cert.pem"
    dest: "{{ registry_certs_d_path }}/ca.crt"
    mode: "0444"
  when: cork_deploy_registry_certs | bool
  notify:
    - Restart corkd

- name: Deploy cork zot-client certificate (CN=cmgr, read-write)
  ansible.builtin.copy:
    src: "{{ cork_cert_src }}/zot-client-cert.pem"
    dest: "{{ registry_certs_d_path }}/client.cert"
    mode: "0444"
  when: cork_deploy_registry_certs | bool
  notify:
    - Restart corkd

- name: Deploy cork zot-client key
  ansible.builtin.copy:
    src: "{{ cork_cert_src }}/zot-client-key.pem"
    dest: "{{ registry_certs_d_path }}/client.key"
    mode: "0400"
  when: cork_deploy_registry_certs | bool
  notify:
    - Restart corkd
