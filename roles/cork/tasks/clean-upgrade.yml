---
# Removes this host's cork database, its artifact tarballs and, where it builds,
# its local images before upgrading.
#
# Destructive, and more so than it looks on a build plane: that database is what
# records which build id each artifact bundle is named by, and an orchestrator
# has adopted those ids. Clearing it here makes every later hand-over conflict
# with rows the orchestrator already holds. See BUILDER.md on recovering a lost
# plane database -- the answer is to release every schema that orchestrator
# holds from this plane and build them together, not to wipe one side.

- name: Ensure corkd service is stopped
  ansible.builtin.service:
    name: corkd
    state: stopped
  become: yes
  register: corkd_service
  failed_when: corkd_service is failed and not 'Could not find the requested service' in corkd_service.msg
  retries: 0
  until: corkd_service.status.ActiveState == "stopped"
  when: cork_daemon_enabled | bool

- name: Ensure cmgr-artifact-server service is stopped
  ansible.builtin.service:
    name: cmgr_artifact_server
    state: stopped
  become: yes
  register: artifact_server_service
  failed_when: artifact_server_service is failed and not 'Could not find the requested service' in artifact_server_service.msg
  retries: 0
  until: artifact_server_service.status.ActiveState == "stopped"
  when: artifact_server_enabled | bool

- name: Remove existing cork database
  ansible.builtin.file:
    path: "{{ cork_db }}"
    state: absent

- name: Remove existing artifact tarballs
  ansible.builtin.shell: /bin/rm -rf {{ cork_artifact_dir }}/*
  when: artifact_server_enabled | bool
  changed_when: true

# Only where this host builds. An orchestrator on an external build plane has no
# docker daemon at all, and the images are on the plane and in the registry.
- name: Prune unused Docker images
  ansible.builtin.command: docker image prune --all --force
  when: cork_build_plane != "external" or (cork_builder_enabled | bool)
  register: image_prune
  changed_when: "'Total reclaimed space: 0B' not in image_prune.stdout"
