---
version: "latest"
upgrade: no
clean_upgrade: no
cork_github_url: "https://github.com/CyLabAcademy/challenge-orchestrator"

cork_deploy_certs: yes
cork_cert_src: "./docker-certs"
docker_cert_path: "/root/.docker_certs"
cmgr_registry: "REPLACE_ME:5000"

cmgr_db: "{{ challenge_dir }}/cmgr.db"
cmgr_dir: "{{ challenge_dir }}"
cmgr_artifact_dir: "{{ challenge_dir }}"
cmgr_logging: "warn"
cmgr_registry_cert_dir: null
cmgr_ports: null
cmgr_concurrent_launches: null
# Must be <= the container sweep in multihost_docker (docker_reaper_command --min-age,
# currently 30m). docker-reaper force-removes the container while this only expires cmgr's
# database row, so a longer prune age leaves cmgrd reporting an instance whose container is
# already gone -- the player gets connection-refused and nothing is logged. The two values
# live in different roles and nothing checks them against each other.
cmgr_prune_age: 30m
cmgr_db_wal: null
cmgr_enable_disk_quotas: null
# Where cmgrd keeps its base image digest pins (CMGR_BASE_PINS).
#
# The corpus root, deliberately, so the file is COMMITTED to the challenge
# repository and versioned with the Dockerfiles it pins. cmgrd's own default is
# <CMGR_DIR>/.base-pins.json -- a dotfile, which nobody commits and a
# `git clean -xdf` erases, leaving the pins as untracked state on one machine.
# That matters because losing them is not a no-op: an empty pin map fingerprints
# differently, so every challenge's next rebuild produces a differently tagged
# image.
#
# Committed instead, a base bump is a reviewable diff, a fresh clone restores it,
# and a rebuilt orchestrator comes back pinned. It sits outside every challenge
# directory, so it perturbs no source checksum, and cork's own scan ignores it.
#
# Nothing creates the file; `cmgrd-cli pin-refresh` writes it (dirtying the
# checkout -- commit the result), and an absent one simply means no pinning. Set
# to null to leave CMGR_BASE_PINS unset and take cmgrd's default.
cmgr_base_pins: "{{ cmgr_dir }}/base-pins.json"
cmgr_extra_environment_vars: {}

artifact_server_version: "latest"
artifact_server_upgrade: no
artifact_server_service_enabled: yes
artifact_server_backend: "selfhosted"
artifact_server_other_options: ""
artifact_server_extra_environment_vars: {}
artifact_server_github_url: "https://github.com/picoCTF/cmgr-artifact-server"
