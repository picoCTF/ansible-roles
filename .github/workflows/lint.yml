name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  roles:
    name: Structural checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install checker dependencies
        run: python3 -m pip install --user --quiet pyyaml jinja2

      # Blocking, and deliberately narrow: every YAML file parses, every
      # template parses, and every variable a template reads is defined
      # somewhere in its role. These are the mistakes that otherwise surface
      # only when a play runs against a real host.
      - name: Roles parse and templates resolve
        run: python3 ci/check_roles.py

  ansible-lint:
    name: ansible-lint
    runs-on: ubuntu-latest
    # Blocking. It was advisory while the report ran to 758 findings, 600 of
    # which were two settled conventions -- unprefixed variable names and the
    # yes/no idiom. Those are declared in .ansible-lint and the rest were
    # cleared, so the report is 0 failures and 83 warnings and a new violation
    # now means someone introduced one.
    #
    # The 83 warnings are name[missing] and yaml[line-length], in warn_list
    # because they are worth doing and not worth blocking on. They do not fail
    # this job; only real violations do.
    #
    # The toolchain is pinned in ci/lint/requirements.txt rather than inline
    # here, because Dependabot reads manifests and cannot see a version written
    # into a run: step. That file explains what the pins are protecting.
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ansible-lint
        run: python3 -m pip install --user --quiet -r ci/lint/requirements.txt

      - name: Run ansible-lint
        run: ~/.local/bin/ansible-lint -f pep8 --nocolor
