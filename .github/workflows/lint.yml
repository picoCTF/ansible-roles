name: Lint

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  roles:
    name: Structural checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install checker dependencies
        run: python3 -m pip install --user --quiet pyyaml jinja2

      # Blocking, and deliberately narrow: every YAML file parses, every
      # template parses, and every variable a template reads is defined
      # somewhere in its role. These are the mistakes that otherwise surface
      # only when a play runs against a real host.
      - name: Roles parse and templates resolve
        run: python3 ci/check_roles.py

  ansible-lint:
    name: ansible-lint (advisory)
    runs-on: ubuntu-latest
    # Still advisory, but no longer drowning. The two long-standing choices
    # here -- unprefixed variable names and the yes/no idiom -- used to be 600
    # of 758 findings; .ansible-lint declares them settled so the report is
    # about everything else. What is left is 73 findings and 83 warnings.
    #
    # Gating on it is the goal and needs those 73 cleared first, most of them
    # risky-file-permissions. Until then the step reports its real exit status
    # and the job is allowed to fail without failing the build -- which is the
    # difference between "nothing was found" and "nobody looked".
    continue-on-error: true
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install ansible-lint
        run: python3 -m pip install --user --quiet ansible-lint

      - name: Run ansible-lint
        run: ~/.local/bin/ansible-lint -f pep8 --nocolor
